<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - Ubong Ken</title>
    <meta name="description" content="A comprehensive product review form for Pioneer Global Logistics clients to provide feedback on our shipping and freight services.">
    <meta name="author" content="Ubong Ken">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            
            <fieldset>
                <legend>Product Information</legend>
                
                <label for="product-select">Product Name *</label>
                <select id="product-select" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
                
                <label>Overall Rating *</label>
                <div class="rating-group">
                    <label for="rating-1"><input type="radio" id="rating-1" name="rating" value="1" required> ☆</label>
                    <label for="rating-2"><input type="radio" id="rating-2" name="rating" value="2" required> ☆☆</label>
                    <label for="rating-3"><input type="radio" id="rating-3" name="rating" value="3" required> ☆☆☆</label>
                    <label for="rating-4"><input type="radio" id="rating-4" name="rating" value="4" required> ☆☆☆☆</label>
                    <label for="rating-5"><input type="radio" id="rating-5" name="rating" value="5" required> ☆☆☆☆☆</label>
                </div>
                
                <label for="installation-date">Date of Installation *</label>
                <input type="date" id="installation-date" name="installation" required>
            </fieldset>

            <fieldset>
                <legend>Review Details</legend>
                
                <label>Which features did you find useful? (Check all that apply)</label>
                <div class="checkbox-group">
                    <label for="feature-durability"><input type="checkbox" id="feature-durability" name="feature" value="durability"> Durability</label>
                    <label for="feature-ease"><input type="checkbox" id="feature-ease" name="feature" value="ease"> Ease of Use</label>
                    <label for="feature-performance"><input type="checkbox" id="feature-performance" name="feature" value="performance"> Performance</label>
                    <label for="feature-design"><input type="checkbox" id="feature-design" name="feature" value="design"> Design</label>
                </div>
                
                <label for="written-review">Written Review (Optional)</label>
                <textarea id="written-review" name="review_text" rows="5"></textarea>
                
                <label for="user-name">Your Name (Optional)</label>
                <input type="text" id="user-name" name="user">
            </fieldset>

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Ubong Ken | WDD 131</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
