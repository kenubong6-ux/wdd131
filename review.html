<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Confirmation - Ubong Ken</title>
    <link rel="stylesheet" href="styles/form.css">
</head>
<body>
    <header>
        <h1>Review Submitted</h1>
    </header>

    <main class="confirmation-message">
        <h2>Thank You!</h2>
        <p>Your review has been successfully posted.</p>
        <p>You have submitted <span id="review-counter" style="font-weight: bold; color: green;"></span> reviews.</p>
        <a href="form.html">Submit Another Review</a>
    </main>

    <script>
        // Use localStorage to track the number of reviews
        let reviewsCount = window.localStorage.getItem("reviewsCount") || 0;
        reviewsCount++;
        window.localStorage.setItem("reviewsCount", reviewsCount);
        
        document.getElementById("review-counter").textContent = reviewsCount;
    </script>
</body>
</html>
