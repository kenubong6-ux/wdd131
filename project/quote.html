<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pioneer Global Logistics | Request Quote</title>
    <meta name="description" content="Request a fast and accurate global freight quote from Pioneer Global Logistics.">
    <meta name="author" content="Ubong Ken">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/main.css">
    <script src="scripts/main.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">Pioneer Logistics</div>
        <button id="menu-button" aria-label="Menu">☰</button>
        <nav id="main-nav">
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="quote.html" class="active">Request Quote</a>
        </nav>
    </header>

    <main>
        <section class="content-section">
            <h2 style="text-align: center; margin-bottom: 2rem;">Request a Freight Quote</h2>
            
            <form id="quote-form" action="thankyou.html" method="get">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Business Email *</label>
                <input type="email" id="email" name="email" required>

                <label for="service-type">Freight Type *</label>
                <select id="service-type" name="service" required>
                    <option value="" disabled selected>Select a freight type...</option>
                    <option value="ocean">Ocean Freight</option>
                    <option value="air">Air Freight</option>
                    <option value="ground">Ground/Rail Freight</option>
                </select>

                <label for="details">Shipment Details (Optional)</label>
                <textarea id="details" name="details" rows="5" placeholder="Dimensions, weight, origin, and destination..."></textarea>

                <input type="submit" value="Submit Request" class="cta-button" style="border: none; cursor: pointer; width: 100%; font-size: 1.1rem;">
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Pioneer Global Logistics | Ubong Ken</p>
        <p id="lastModified"></p>
        <p><a href="references.html">Site References</a></p>
    </footer>
</body>
</html>
